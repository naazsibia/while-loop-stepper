<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>while loops, step by step</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;700&family=Atkinson+Hyperlegible+Next:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F8; --panel:#FFFFFF; --ink:#1C2230; --muted:#737B8C; --rule:#DCE0E7;
  --str:#596173; --dim:#BCC1CB;
  --hl:#FFE36E;              /* the one highlight colour: "now" */
  --sans:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Atkinson Hyperlegible Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13161C; --panel:#1B1F27; --ink:#E6E8ED; --muted:#8C93A2; --rule:#2C323D;
    --str:#A9B0BE; --dim:#454C59; --hl:rgba(242,203,72,.32); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13161C; --panel:#1B1F27; --ink:#E6E8ED; --muted:#8C93A2; --rule:#2C323D;
  --str:#A9B0BE; --dim:#454C59; --hl:rgba(242,203,72,.32); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.4}
.app{max-width:1600px;margin:0 auto;padding:clamp(12px,2.2vw,30px);display:flex;flex-direction:column;gap:clamp(12px,1.6vw,20px)}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px}
.tabs{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.group{display:flex;align-items:center;gap:10px}
.glabel{font-size:15px;color:var(--muted)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--rule);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg button{font:inherit;font-size:15px;border:0;background:transparent;color:var(--muted);padding:.5em .95em;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.toggle{display:inline-flex;align-items:center;gap:.5em;color:var(--muted);font-size:15px;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--ink);width:1.05em;height:1.05em;margin:0}
.link{font:inherit;font-size:15px;color:var(--ink);background:none;border:0;padding:.2em 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule)}
.link:hover{text-decoration-color:var(--ink)}

/* recipe */
.recipe{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,1.6vw,20px)}
.recipe li{display:flex;gap:.7em;align-items:flex-start;padding:.15em .3em;border-radius:8px;cursor:pointer}
.recipe li:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.recipe b{display:block;font-weight:600;font-size:17px}
.recipe span.d{display:block;color:var(--muted);font-size:15px}
.rnum,.rc i{display:inline-grid;place-items:center;border-radius:50%;border:1.5px solid var(--muted);color:var(--muted);font-style:normal;font-family:var(--mono);flex:none}
.rnum{width:1.6em;height:1.6em;font-size:15px;margin-top:.05em}
.recipe li.on .rnum,.rc i.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.recipe li.on b{text-decoration:underline;text-decoration-style:dashed;text-underline-offset:4px}
@media (max-width:820px){.recipe{grid-template-columns:minmax(0,1fr)}}

/* main */
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(12px,1.6vw,20px);align-items:start}
@media (max-width:960px){.main{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:12px}

/* code */
.code{font-family:var(--mono);font-size:clamp(13px,1.05vw,19px);padding:1em 1.4em 1em 0;overflow-x:auto;--row:1.9em}
.lines{position:relative;min-width:max-content}
.hl{position:absolute;left:0;right:0;top:0;height:var(--row);background:var(--hl);
    transform:translateY(calc(var(--line,0) * var(--row)));transition:transform .3s cubic-bezier(.3,.7,.2,1)}
.line{position:relative;height:var(--row);line-height:var(--row);white-space:pre;display:flex;align-items:center}
.ln{flex:none;width:2.9em;padding-right:.7em;text-align:right;color:var(--muted);user-select:none}
.rc{flex:none;width:1.9em;display:flex;align-items:center}
.rc i{width:1.35em;height:1.35em;font-size:.68em;cursor:pointer;line-height:1}
.line.cur .ln{color:var(--ink);font-weight:700}
.k{font-weight:700}
.s{color:var(--str)}
.tok{border-radius:3px;cursor:pointer}
.note{padding-left:2em;color:var(--ink);opacity:.72}
.arg{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1.5px dashed var(--muted);
     padding:0;margin:0;min-width:1ch;line-height:1.25;border-radius:0}
.arg.sv{color:var(--str)}
.arg.blank{border:1.5px dashed var(--muted);border-radius:5px;padding:0 .3ch;margin:0 .1ch;box-sizing:content-box}
.arg:focus{outline:none;border-color:var(--ink);border-bottom-style:solid}
.arg.blank:focus{border-style:solid}
.arg[aria-invalid="true"]{text-decoration:wavy underline var(--ink);text-underline-offset:4px}
.mirror{color:var(--ink)}

/* state */
.state{padding:1.2em 1.4em 1.4em;font-family:var(--mono)}
.vars{display:grid;grid-template-columns:max-content minmax(0,1fr);column-gap:1.3em;row-gap:.75em;align-items:center;
      font-size:clamp(16px,1.3vw,22px);transition:opacity .2s}
.vrow{display:grid;grid-template-columns:subgrid;grid-column:1/-1;align-items:center}
.vrow.strow{grid-template-columns:minmax(0,1fr);row-gap:.35em;margin-bottom:.3em;container-type:inline-size}
.vname{justify-self:start;padding:.05em .25em;border-radius:4px;cursor:pointer}
.vname:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.val{justify-self:start;padding:0 .15em;overflow-wrap:anywhere}
.val.chg{background:linear-gradient(transparent 58%,var(--hl) 58%)}
.state.ended .vars{opacity:.5}
.hint{margin:1em 0 0;font-family:var(--sans);font-size:16px;color:var(--muted)}
.hint:empty{display:none}

.stripwrap{overflow-x:auto;padding:.3em 2.5em .2em .2em;font-size:clamp(12px,calc(100cqw / (var(--cells) * 2.25 + 2.5)),30px)}
.strip{display:flex;gap:.35em;position:relative;width:max-content}
.strip.haslimit{padding-top:1.2em}
.cell{display:flex;flex-direction:column;align-items:center;gap:.2em;flex:none}
.box{width:1.9em;height:1.9em;font-size:1em;display:grid;place-items:center;border:1.5px solid var(--rule);border-radius:7px;
     background:var(--panel);transition:background .2s,opacity .2s;white-space:pre}
.num .box{color:var(--muted)}
.box.read{background:var(--hl);border-color:transparent}
.cell.ghost .box{border-style:dashed;background:transparent}
.cell.ghost .box.read{border-color:var(--ink)}
.cell.ghost.off{visibility:hidden}
.idx{font-size:.48em;color:var(--muted)}
.limit{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--muted)}
.limit span{position:absolute;top:-.15em;left:.35em;font-size:.6em;color:var(--muted);white-space:nowrap}
.ptrrow{position:relative;height:2.2em}
.ptr{position:absolute;top:0;width:1.9em;display:flex;flex-direction:column;align-items:center;transition:left .3s cubic-bezier(.3,.7,.2,1)}
.ptr .bar{width:100%;height:.32em;border:2px solid var(--ink);border-top:0;border-radius:0 0 4px 4px}
.ptr .plabel{font-size:.62em;margin-top:.25em;white-space:nowrap;padding:0 .2em;border-radius:3px}

.trail{display:flex;flex-wrap:wrap;gap:.4em;font-size:clamp(15px,1.25vw,21px)}
.chip{min-width:2.1em;padding:.2em .5em;text-align:center;border:1.5px solid var(--rule);border-radius:7px;transition:background .2s}
.chip.last{border-color:var(--ink)}
.chip.read{background:var(--hl);border-color:transparent}

/* output */
.outwrap{margin-top:1.4em}
.outlabel{font-family:var(--sans);font-size:15px;color:var(--muted);margin-bottom:.4em}
.out{font-size:clamp(15px,1.3vw,22px);border-top:1px solid var(--rule);padding-top:.5em;min-height:2.2em;max-height:11.5em;overflow-y:auto}
.out div{padding:.05em 0;overflow-wrap:anywhere}
.out .new span{background:linear-gradient(transparent 58%,var(--hl) 58%)}
.out .err{font-weight:700}

/* brushing a variable: it lights up everywhere, the rest steps back */
.brushing .src,.brushing .src .k,.brushing .src .s,.brushing .src .arg,.brushing .src .mirror{color:var(--dim)}
.brushing .src .tok.on{color:var(--ink)}
.brushing .vrow:not(.on){opacity:.32}
.brushing .box:not(.on),.brushing .chip:not(.on){opacity:.3}
.brushing .ptr:not(.on){opacity:.3}
.tok.on,.vrow.on .vname,.box.on,.chip.on,.ptr.on .plabel{outline:2px dashed var(--ink);outline-offset:2px}
/* brushing a recipe step: its lines stay, the rest steps back */
.rbrushing .line:not(.ron) .src,.rbrushing .line:not(.ron) .src *{color:var(--dim)}
.rbrushing .line:not(.ron) .arg{border-color:var(--dim)}
.rbrushing .line.ron .src{outline:2px dashed var(--ink);outline-offset:3px;border-radius:4px}

/* controls */
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.btn{font:inherit;font-weight:600;font-size:16px;padding:.55em 1.15em;border-radius:9px;border:1px solid var(--rule);
     background:var(--panel);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);min-width:6.5em}
.btn:disabled{opacity:.38;cursor:default}
button:focus-visible,.toggle input:focus-visible,input[type=range]:focus-visible,.rc i:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
#scrub{flex:1;min-width:160px;accent-color:var(--ink)}
.spacer{flex:1}
.counter{font-family:var(--mono);font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:5.5em;text-align:right}

@media (prefers-reduced-motion: reduce){.hl,.ptr,.box,.vars,.chip{transition:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="tabs">
      <div class="group"><span class="glabel">Demo</span><div class="seg" id="seg-demo" role="group" aria-label="Demo examples"></div></div>
      <div class="group"><span class="glabel">Worksheet</span><div class="seg" id="seg-ws" role="group" aria-label="Worksheet questions"></div></div>
    </div>
    <div class="tools">
      <label class="toggle"><input type="checkbox" id="results" checked> Show results</label>
      <button class="link" id="reset">Reset code</button>
      <button class="link" id="answers" hidden>Show answers</button>
    </div>
  </header>

  <ol class="recipe" aria-label="Loop recipe">
    <li data-recipe="start" tabindex="0"><span class="rnum">1</span><div><b>Loop variable</b><span class="d">Start a counter, or a position (index) in a string</span></div></li>
    <li data-recipe="stop" tabindex="0"><span class="rnum">2</span><div><b>Stopping condition</b><span class="d">The loop runs while this is True</span></div></li>
    <li data-recipe="step" tabindex="0"><span class="rnum">3</span><div><b>Progress</b><span class="d">Each pass moves the loop variable closer to stopping</span></div></li>
  </ol>

  <main class="main">
    <section class="panel code" aria-label="Code"><div class="lines" id="lines"></div></section>
    <section class="panel state" id="state" aria-label="Variables and output">
      <div class="vars" id="vars"></div>
      <p class="hint" id="hint"></p>
      <div class="outwrap" id="outwrap"><div class="outlabel">Output</div><div class="out" id="out"></div></div>
    </section>
  </main>

  <nav class="controls" aria-label="Step controls">
    <button class="btn" id="restart" title="Home">Restart</button>
    <button class="btn" id="back" title="Left arrow">Back</button>
    <button class="btn primary" id="next" title="Right arrow or Space">Step</button>
    <input type="range" id="scrub" min="0" max="0" value="0" aria-label="Jump to step">
    <span class="counter" id="counter"></span>
  </nav>
</div>
<script>
/* ===== A tiny Python expression evaluator (ints are BigInt, floats are Number) ===== */
class PyError extends Error { constructor(name, msg) { super(msg || ''); this.pyName = name; } }
const syntax = m => new PyError('SyntaxError', m || 'invalid syntax');
const typeErr = m => new PyError('TypeError', m);
const zde = m => new PyError('ZeroDivisionError', m);
const KWS = new Set(['and', 'or', 'not', 'in', 'is', 'True', 'False', 'None']);

function tokenize(src) {
  const toks = []; let i = 0;
  while (i < src.length) {
    const c = src[i];
    if (/\s/.test(c)) { i++; continue; }
    const s0 = i;
    if (/\d/.test(c) || (c === '.' && /\d/.test(src[i + 1] || ''))) {
      while (/\d/.test(src[i] || '')) i++;
      let fl = false;
      if (src[i] === '.' && !/[A-Za-z_]/.test(src[i + 1] || '')) { fl = true; i++; while (/\d/.test(src[i] || '')) i++; }
      toks.push({ t: fl ? 'float' : 'int', v: src.slice(s0, i), s0, s1: i }); continue;
    }
    if (c === "'" || c === '"') {
      i++; let val = '';
      while (i < src.length && src[i] !== c) {
        if (src[i] === '\\') { const n = src[i + 1] || ''; val += n === 'n' ? '\n' : n === 't' ? '\t' : n; i += 2; }
        else val += src[i++];
      }
      if (i >= src.length) throw syntax('unterminated string literal');
      i++; toks.push({ t: 'str', v: val, s0, s1: i }); continue;
    }
    if (/[A-Za-z_]/.test(c)) {
      while (/\w/.test(src[i] || '')) i++;
      const w = src.slice(s0, i);
      toks.push({ t: KWS.has(w) ? 'kw' : 'name', v: w, s0, s1: i }); continue;
    }
    const two = src.slice(i, i + 2);
    if (['//', '**', '==', '!=', '<=', '>='].includes(two)) { toks.push({ t: 'op', v: two, s0, s1: i + 2 }); i += 2; continue; }
    if ('+-*/%<>()[]:,.'.includes(c)) { toks.push({ t: 'op', v: c, s0, s1: i + 1 }); i++; continue; }
    if (c === '=') throw syntax("invalid syntax. Maybe you meant '=='?");
    throw syntax();
  }
  toks.push({ t: 'eof', v: '', s0: src.length, s1: src.length });
  return toks;
}

function parse(src) {
  const T = tokenize(src); let p = 0;
  const next = () => T[p++];
  const isOp = v => T[p].t === 'op' && T[p].v === v;
  const isKw = v => T[p].t === 'kw' && T[p].v === v;
  const expect = v => { if (!isOp(v)) throw syntax(); return next(); };
  const node = (o, s0, s1) => Object.assign(o, { s0, s1, src: src.slice(s0, s1) });
  const orE = () => { let l = andE(); while (isKw('or')) { next(); const r = andE(); l = node({ t: 'bool', op: 'or', l, r }, l.s0, r.s1); } return l; };
  const andE = () => { let l = notE(); while (isKw('and')) { next(); const r = notE(); l = node({ t: 'bool', op: 'and', l, r }, l.s0, r.s1); } return l; };
  const notE = () => { if (isKw('not')) { const s0 = next().s0; const x = notE(); return node({ t: 'not', x }, s0, x.s1); } return cmpE(); };
  const cmpOp = () => {
    const k = T[p];
    if (k.t === 'op' && ['<', '>', '==', '!=', '<=', '>='].includes(k.v)) { p++; return k.v; }
    if (isKw('in')) { p++; return 'in'; }
    if (isKw('not') && T[p + 1].t === 'kw' && T[p + 1].v === 'in') { p += 2; return 'not in'; }
    if (isKw('is')) { p++; if (isKw('not')) { p++; return 'is not'; } return 'is'; }
    return null;
  };
  const cmpE = () => {
    const first = sumE(), ops = [], items = [first]; let op;
    while ((op = cmpOp())) { ops.push(op); items.push(sumE()); }
    return ops.length ? node({ t: 'cmp', ops, items }, first.s0, items[items.length - 1].s1) : first;
  };
  const sumE = () => { let l = termE(); while (isOp('+') || isOp('-')) { const op = next().v; const r = termE(); l = node({ t: 'bin', op, l, r }, l.s0, r.s1); } return l; };
  const termE = () => { let l = unaryE(); while (['*', '/', '//', '%'].some(isOp)) { const op = next().v; const r = unaryE(); l = node({ t: 'bin', op, l, r }, l.s0, r.s1); } return l; };
  const unaryE = () => { if (isOp('-') || isOp('+')) { const k = next(); const x = unaryE(); return node({ t: 'unary', op: k.v, x }, k.s0, x.s1); } return powE(); };
  const powE = () => { const b = postE(); if (isOp('**')) { next(); const x = unaryE(); return node({ t: 'bin', op: '**', l: b, r: x }, b.s0, x.s1); } return b; };
  const postE = () => {
    let e = atom();
    for (;;) {
      if (isOp('(')) {
        next(); const args = [];
        if (!isOp(')')) { args.push(orE()); while (isOp(',')) { next(); args.push(orE()); } }
        e = node({ t: 'call', f: e, args }, e.s0, expect(')').s1);
      } else if (isOp('[')) {
        next(); let a = null, b = null, sl = false;
        if (!isOp(':')) a = orE();
        if (isOp(':')) { next(); sl = true; if (!isOp(']')) b = orE(); }
        const s1 = expect(']').s1;
        if (!sl && !a) throw syntax();
        e = sl ? node({ t: 'slice', o: e, a, b }, e.s0, s1) : node({ t: 'index', o: e, i: a }, e.s0, s1);
      } else if (isOp('.')) {
        next(); const n = next(); if (n.t !== 'name') throw syntax();
        e = node({ t: 'attr', o: e, name: n.v }, e.s0, n.s1);
      } else return e;
    }
  };
  const atom = () => {
    const k = next();
    if (k.t === 'int') return node({ t: 'lit', v: BigInt(k.v) }, k.s0, k.s1);
    if (k.t === 'float') return node({ t: 'lit', v: parseFloat(k.v) }, k.s0, k.s1);
    if (k.t === 'str') return node({ t: 'lit', v: k.v }, k.s0, k.s1);
    if (k.t === 'kw' && (k.v === 'True' || k.v === 'False')) return node({ t: 'lit', v: k.v === 'True' }, k.s0, k.s1);
    if (k.t === 'kw' && k.v === 'None') return node({ t: 'lit', v: null }, k.s0, k.s1);
    if (k.t === 'name') return node({ t: 'name', id: k.v }, k.s0, k.s1);
    if (k.t === 'op' && k.v === '(') { const e = orE(); const s1 = expect(')').s1; e.paren = true; return node(e, k.s0, s1); }
    throw syntax();
  };
  const ast = orE();
  if (T[p].t !== 'eof') throw syntax();
  return ast;
}
const parseCache = new Map();
function parseCached(src) {
  if (!parseCache.has(src)) { try { parseCache.set(src, parse(src)); } catch (e) { parseCache.set(src, e); } }
  const r = parseCache.get(src);
  if (r instanceof Error) throw r;
  return r;
}

const isInt = v => typeof v === 'bigint' || typeof v === 'boolean';
const isNum = v => isInt(v) || typeof v === 'number';
const big = v => (typeof v === 'boolean' ? (v ? 1n : 0n) : v);
const tname = v => v === null ? 'NoneType' : typeof v === 'string' ? 'str' : typeof v === 'bigint' ? 'int'
  : typeof v === 'boolean' ? 'bool' : typeof v === 'number' ? 'float' : 'builtin_function_or_method';
const truthy = v => v === null ? false : typeof v === 'string' ? v.length > 0 : typeof v === 'bigint' ? v !== 0n
  : typeof v === 'number' ? v !== 0 : typeof v === 'boolean' ? v : true;
function pyQuote(s) {
  const q = s.includes("'") && !s.includes('"') ? '"' : "'";
  return q + s.replace(/\\/g, '\\\\').split(q).join('\\' + q).replace(/\n/g, '\\n').replace(/\t/g, '\\t') + q;
}
function repr(v) {
  if (v === null) return 'None';
  if (typeof v === 'string') return pyQuote(v);
  if (typeof v === 'boolean') return v ? 'True' : 'False';
  if (typeof v === 'number') return Number.isFinite(v) ? (Number.isInteger(v) ? v.toFixed(1) : String(v)) : (Number.isNaN(v) ? 'nan' : v > 0 ? 'inf' : '-inf');
  if (typeof v === 'bigint') return v.toString();
  return `<built-in function ${v.builtin}>`;
}
const pyStr = v => (typeof v === 'string' ? v : repr(v));

function arith(op, a, b) {
  if (op === '+' && typeof a === 'string' && typeof b === 'string') return a + b;
  if (op === '*' && (typeof a === 'string' || typeof b === 'string') && (isInt(a) || isInt(b))) {
    const s = typeof a === 'string' ? a : b, k = Number(big(typeof a === 'string' ? b : a));
    if (s.length * k > 100000) throw new PyError('MemoryError', 'string too long for this page');
    return s.repeat(Math.max(0, k));

function buildCode() {
  const ex = cur.ex;
  linesEl.innerHTML = '<div class="hl" aria-hidden="true"></div>';
  hlEl = $('.hl', linesEl);
  lineEls = ex.lines.map((tpl, i) => {
    const role = ROLES.find(r => ex.recipe[r].includes(i));
    const d = document.createElement('div');
    d.className = 'line';
    if (role) d.dataset.role = role;
    d.innerHTML = `<span class="ln">${i + 1}</span><span class="rc">${role ? `<i data-recipe="${role}">${ROLES.indexOf(role) + 1}</i>` : ''}</span><span class="src">${lineHTML(tpl, ex)}</span><span class="note"></span>`;
    linesEl.appendChild(d);
    return d;
  });
  $$('.arg', linesEl).forEach(inp => {
    inp.value = cur.vals[inp.dataset.f];
    sizeInput(inp);
    inp.addEventListener('input', () => {
      inp.value = inp.value.replace(/[\r\n]/g, '');
      cur.vals[inp.dataset.f] = inp.value;
      sizeInput(inp);
      updateMirrors();
      load();
    });
  });
  updateMirrors();
}
function sizeInput(inp) {
  const n = inp.value.length;
  inp.style.width = `${n ? n + 0.6 : (inp.classList.contains('blank') ? 7 : 1)}ch`;
}
function updateMirrors() {
  $$('.mirror', linesEl).forEach(m => {
    const name = (cur.vals[m.dataset.of] || '').match(/^\s*([A-Za-z_]\w*)/);
    m.textContent = name ? name[1] : '____';
  });
}

/* ---------- state panel ---------- */
function buildState() {
  const ex = cur.ex, sp = ex.strip;
  varsEl.innerHTML = '';
  rowEls = {}; cellEls = []; ptrEl = limitEl = trailEl = null;

  if (sp && (sp.kind === 'num' || (sp.kind === 'string' && cur.str !== null))) {
    const isStr = sp.kind === 'string', n = isStr ? cur.str.length : 0;
    const row = document.createElement('div');
    row.className = 'vrow strow';
    if (isStr) row.dataset.var = sp.of;
    const cells = range(cur.cells).map(i => {
      const ghost = isStr && i >= n;
      return `<div class="cell${ghost ? ' ghost off' : ''}${isStr ? '' : ' num'}"><div class="box">${isStr ? (ghost ? '' : esc(cur.str[i])) : i}</div>${isStr ? `<div class="idx">${i}</div>` : ''}</div>`;
    }).join('');
    row.innerHTML = `${isStr ? `<span class="vname" tabindex="0">${sp.of}</span>` : ''}
      <div class="stripwrap" style="--cells:${cur.cells + 1}"><div class="strip${cur.limit ? ' haslimit' : ''}">${cells}
      <div class="limit" hidden><span></span></div></div>
      <div class="ptrrow"><div class="ptr" hidden><div class="bar"></div><span class="plabel">${sp.idx}</span></div></div></div>`;
    varsEl.appendChild(row);
    if (isStr) rowEls[sp.of] = row;
    cellEls = $$('.cell', row); ptrEl = $('.ptr', row); limitEl = $('.limit', row);
  }
  if (sp && sp.kind === 'trail') {
    const row = document.createElement('div');
    row.className = 'vrow strow';
    row.dataset.var = sp.of;
    row.innerHTML = `<div class="trail"></div>`;
    varsEl.appendChild(row);
    trailEl = $('.trail', row);
  }
  for (const name of ex.order) {
    if (sp && sp.kind === 'string' && name === sp.of) continue;
    const row = document.createElement('div');
    row.className = 'vrow';
    row.dataset.var = name;
    row.innerHTML = `<span class="vname" tabindex="0">${name}</span><span class="val"></span>`;
    varsEl.appendChild(row);
    rowEls[name] = row;
  }
}

const asIndex = v => (isInt(v) ? Number(big(v)) : null);

function render() {
  const s = cur.steps[cur.k], ex = cur.ex, sp = ex.strip;

  hlEl.hidden = s.line < 0;
  if (s.line >= 0) linesEl.style.setProperty('--line', s.line);
  lineEls.forEach((el, i) => { el.classList.toggle('cur', i === s.line); $('.note', el).textContent = ''; });
  if (s.note && s.line >= 0) {
    const [e, r] = s.note;
    $('.note', lineEls[s.line]).textContent = `# ${e ? e + ' ' : ''}→ ${showRes ? r : '?'}`;
  }

  for (const name of Object.keys(rowEls)) {
    const row = rowEls[name], def = name in s.vars;
    row.hidden = !def;
    const val = $('.val', row);
    if (def && val) {
      val.textContent = repr(s.vars[name]);
      val.classList.toggle('chg', s.changed.includes(name));
    }
  }

  let ptrAt = null;
  if (cellEls.length) {
    const iv = asIndex(s.vars[sp.idx]);
    if (iv !== null && iv >= 0 && iv < cur.cells) ptrAt = iv;
    cellEls.forEach((c, i) => {
      $('.box', c).classList.toggle('read', s.read.includes(i));
      if (c.classList.contains('ghost')) c.classList.toggle('off', !(ptrAt === i || s.read.includes(i)));
    });
    ptrEl.hidden = ptrAt === null;
    if (ptrAt !== null) ptrEl.style.left = `${ptrAt * 2.25}em`;
    let lim = null;
    if (cur.limit) { try { const x = asIndex(quiet(cur.limit.x, s.vars)); if (x !== null) lim = x + cur.limit.plus; } catch (e) { /* not ready */ } }
    limitEl.hidden = lim === null || lim < 0 || lim > cur.cells + 1;
    if (!limitEl.hidden) { limitEl.style.left = `${lim * 2.25 - 0.175}em`; $('span', limitEl).textContent = cur.limit.label; }
  }
  if (trailEl) {
    rowEls[sp.of] && (rowEls[sp.of].hidden = !(sp.of in s.vars));
    trailEl.parentElement.hidden = !s.trail.length;
    const justSet = s.changed.includes(sp.of);
    trailEl.innerHTML = s.trail.map((t, i) => `<span class="chip${i === s.trail.length - 1 ? (justSet ? ' last read' : ' last') : ''}">${esc(t)}</span>`).join('');
  }

  const outEl = $('#out');
  $('#outwrap').hidden = !(ex.prints || s.out.length);
  outEl.innerHTML = s.out.map((t, i) => {
    const last = i === s.out.length - 1;
    const cls = [last && s.outNew ? 'new' : '', last && s.err ? 'err' : ''].join(' ').trim();
    return `<div class="${cls}"><span>${esc(t)}</span></div>`;
  }).join('');
  outEl.scrollTop = outEl.scrollHeight;

  stateEl.classList.toggle('ended', s.ended);

  let hint = cur.status;
  if (!hint && s.ret !== undefined && ex.expect && ex.expect.args.every(a => cur.vals[a] === ex.fields[a].def))
    hint = s.ret === ex.expect.value ? '✓ Matches the docstring example' : `✗ The docstring example expects ${ex.expect.value}`;
  $('#hint').textContent = hint;

  const N = cur.steps.length, inf = !cur.done;
  $('#back').disabled = $('#restart').disabled = cur.k === 0;
  $('#next').disabled = !inf && cur.k === N - 1;
  const scrub = $('#scrub');
  scrub.hidden = inf || N < 2;
  scrub.max = N - 1; scrub.value = cur.k;
  $('#counter').textContent = `${cur.k + 1} / ${inf ? '∞' : N}`;

  applyBrush();
}

/* ---------- brushing & linking ---------- */
function cellsFor(name, s) {
  const sp = cur.ex.strip;
  if (!sp || !(name in s.vars)) return [];
  if (sp.kind === 'string' && name === sp.of) return range(cur.str ? cur.str.length : 0);
  if (name === sp.idx) { const iv = asIndex(s.vars[name]); return iv === null ? [] : [iv]; }
  return [];
}
function applyBrush() {
  const b = hover ?? lock, s = cur.steps[cur.k];
  const varName = b && b.kind === 'var' ? b.name : null, role = b && b.kind === 'recipe' ? b.name : null;
  app.classList.toggle('brushing', !!varName);
  app.classList.toggle('rbrushing', !!role);
  $$('[data-var]').forEach(el => el.classList.toggle('on', el.dataset.var === varName));
  const on = new Set(varName ? cellsFor(varName, s) : []);
  cellEls.forEach((c, i) => $('.box', c).classList.toggle('on', on.has(i)));
  if (ptrEl) ptrEl.classList.toggle('on', !!varName && varName === cur.ex.strip.idx);
  if (trailEl) $$('.chip', trailEl).forEach(c => c.classList.toggle('on', varName === cur.ex.strip.of));
  $$('[data-recipe]').forEach(el => el.classList.toggle('on', el.dataset.recipe === role));
  lineEls.forEach(el => el.classList.toggle('ron', !!role && el.dataset.role === role));
}
function brushTarget(e) {
  if (!e.target.closest || e.target.matches('input')) return null;
  const r = e.target.closest('[data-recipe]');
  if (r) return { kind: 'recipe', name: r.dataset.recipe };
  const v = e.target.closest('[data-var]');
  return v ? { kind: 'var', name: v.dataset.var } : null;
}
const same = (a, b) => !!a && !!b && a.kind === b.kind && a.name === b.name;
document.addEventListener('pointerover', e => { const t = brushTarget(e); if (t && !same(t, hover)) { hover = t; applyBrush(); } });
document.addEventListener('pointerout', e => {
  const el = e.target.closest && (e.target.closest('[data-recipe]') || e.target.closest('[data-var]'));
  if (!el || (e.relatedTarget && el.contains(e.relatedTarget))) return;
  hover = null; applyBrush();
});
document.addEventListener('click', e => { const t = brushTarget(e); if (!t) return; lock = same(t, lock) ? null : t; applyBrush(); });
document.addEventListener('focusin', e => { const t = brushTarget(e); if (t) { hover = t; applyBrush(); } });
document.addEventListener('focusout', e => { if (brushTarget(e)) { hover = null; applyBrush(); } });

/* ---------- stepping ---------- */
function ensure(k) {
  while (cur.steps.length <= k && !cur.done) {
    const r = cur.gen.next();
    if (r.done) { cur.done = true; break; }
    cur.steps.push(r.value);
  }
}
function go(k) { ensure(k); cur.k = Math.max(0, Math.min(cur.steps.length - 1, k)); render(); }
$('#next').onclick = () => go(cur.k + 1);
$('#back').onclick = () => go(cur.k - 1);
$('#restart').onclick = () => go(0);
$('#scrub').oninput = e => go(+e.target.value);
$('#results').onchange = e => { showRes = e.target.checked; render(); };

document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.matches('input.arg, input[type=range]')) { if (e.key === 'Escape' || e.key === 'Enter') t.blur(); return; }
  if (t.matches('button') && (e.key === ' ' || e.key === 'Enter')) return;
  if ((t.dataset.var || t.dataset.recipe) && e.key === 'Enter') { t.click(); return; }
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(cur.k + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); go(cur.k - 1); }
  else if (e.key === 'Home') { e.preventDefault(); go(0); }
  else if (e.key === 'End' && cur.done) { e.preventDefault(); go(cur.steps.length - 1); }
  else if (e.key === 'Escape') { lock = hover = null; applyBrush(); }
});

/* ---------- running the code ---------- */
function load() {
  const ex = cur.ex, vals = cur.vals;
  let blanks = false; const bad = new Set();
  for (const [id, f] of Object.entries(ex.fields)) {
    const t = vals[id].trim();
    if (f.kind !== 'expr') continue;
    if (f.blank && !t) { blanks = true; continue; }
    if (!t) { bad.add(id); continue; }
    try { parseCached(t); } catch (e) { bad.add(id); }
  }
  $$('.arg', linesEl).forEach(inp => inp.setAttribute('aria-invalid', String(bad.has(inp.dataset.f))));
  cur.status = bad.size ? 'SyntaxError: check the box with the wavy underline.' : blanks ? 'Fill in the blanks to run this.' : '';

  cur.k = 0; cur.limit = null; cur.str = null;
  if (cur.status) {
    cur.steps = [{ line: ex.entry || 0, vars: {}, changed: [], out: [], outNew: false, err: false, note: null, read: [], ended: false, trail: [] }];
    cur.done = true;
  } else {
    cur.gen = runGuarded(ex, { ...vals }); cur.steps = []; cur.done = false;
    ensure(MAX_PRERUN);
    const sp = ex.strip;
    if (sp && sp.idx) {
      try { cur.limit = limitFrom(parseCached(ex.cond.replace(/\{(\w+)\}/g, (m, id) => vals[id])), sp.idx); } catch (e) { cur.limit = null; }
      let maxPtr = 0;
      for (const st of cur.steps) { const iv = asIndex(st.vars[sp.idx]); if (iv !== null && iv > maxPtr) maxPtr = iv; for (const r of st.read) if (r > maxPtr) maxPtr = r; }
      if (sp.kind === 'string') {
        const first = cur.steps.find(st => typeof st.vars[sp.of] === 'string');
        cur.str = first ? first.vars[sp.of] : null;
        if (cur.str !== null) cur.cells = Math.min(cur.str.length + 8, Math.max(cur.str.length, maxPtr + 1));
      } else {
        let lim = 0;
        if (cur.limit) { const last = cur.steps[cur.steps.length - 1]; try { lim = asIndex(quiet(cur.limit.x, last.vars)) ?? 0; } catch (e) { lim = 0; } }
        cur.cells = Math.min(30, Math.max(maxPtr, lim, 7) + 1);
      }
    }
  }
  buildState();
  render();
}

/* ---------- examples, reset, answers ---------- */
function useExample(key) {
  if (cur.key) saved[cur.key] = cur.vals;
  cur.key = key; cur.ex = PROGRAMS[key];
  cur.vals = saved[key] || Object.fromEntries(Object.entries(cur.ex.fields).map(([id, f]) => [id, f.def]));
  hover = lock = null;
  $$('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.ex === key)));
  const ws = cur.ex.group === 'ws';
  $('#answers').hidden = !ws;
  $('#answers').textContent = answerBackup[key] ? 'Hide answers' : 'Show answers';
  buildCode();
  load();
}
$('#reset').onclick = () => {
  delete saved[cur.key]; delete answerBackup[cur.key];
  cur.vals = Object.fromEntries(Object.entries(cur.ex.fields).map(([id, f]) => [id, f.def]));
  $('#answers').textContent = 'Show answers';
  buildCode(); load();
};
$('#answers').onclick = () => {
  const key = cur.key;
  if (answerBackup[key]) { cur.vals = answerBackup[key]; delete answerBackup[key]; }
  else {
    answerBackup[key] = { ...cur.vals };
    cur.vals = { ...cur.vals };
    for (const [id, f] of Object.entries(cur.ex.fields)) if (f.sol !== undefined) cur.vals[id] = f.sol;
  }
  $('#answers').textContent = answerBackup[key] ? 'Hide answers' : 'Show answers';
  buildCode(); load();
};
for (const [key, ex] of Object.entries(PROGRAMS)) {
  const b = document.createElement('button');
  b.dataset.ex = key; b.textContent = ex.label; b.setAttribute('aria-pressed', 'false');
  b.onclick = () => useExample(key);
  $(ex.group === 'ws' ? '#seg-ws' : '#seg-demo').appendChild(b);
}
useExample('count3');
</script>
</body>
</html>
